# Jenn's shared pipeline for every app: test, then build, then deploy through git.
#
#   pull request  -> test: unit tests (if any), build the image, run it, check it answers
#   merge to main -> test again, publish ghcr.io/jennpcfo/<app>:<commit>, then pin that exact
#                    tag in deploy/kustomization.yaml. Argo CD sees the commit and deploys it.
#
# Never `latest`: what runs is always a commit you can name. The same pattern as Fortified
# Freedom's pipeline, without Kargo. Apps call this file; fix it here and every app gets the fix.
name: app
on:
  workflow_call:
    inputs:
      image:
        description: Image name without a tag, e.g. ghcr.io/jennpcfo/pourprofitcfo-site
        required: true
        type: string
      port:
        description: Port the container listens on
        type: number
        default: 8080
      health_path:
        description: Path that must answer 200 once the app is up
        type: string
        default: /healthz
      smoke_paths:
        description: Space-separated paths that must answer 200
        type: string
        default: /
      test_command:
        description: Unit tests to run first; empty means none
        type: string
        default: ""
      deploy_dir:
        description: Folder with kustomization.yaml that Argo CD deploys
        type: string
        default: deploy

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        if: inputs.test_command != ''
        run: ${{ inputs.test_command }}
      - name: Deploy files are valid
        run: kubectl kustomize "${{ inputs.deploy_dir }}" > /dev/null
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: app:test
      - name: Run it and check it answers
        run: |
          p=${{ inputs.port }}
          docker run -d --name app --read-only --tmpfs /tmp -p $p:$p app:test
          for i in $(seq 1 30); do curl -fsS -o /dev/null "http://localhost:$p${{ inputs.health_path }}" && break; sleep 1; done
          curl -fsS -o /dev/null "http://localhost:$p${{ inputs.health_path }}" || { docker logs app; exit 1; }
          for path in ${{ inputs.smoke_paths }}; do
            curl -fsS -o /dev/null "http://localhost:$p$path" || { echo "FAILED $path"; docker logs app; exit 1; }
            echo "ok $path"
          done

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ inputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Pin the new image in the deploy files
        run: |
          f="${{ inputs.deploy_dir }}/kustomization.yaml"
          grep -q 'newTag:' "$f" || { echo "$f has no newTag line"; exit 1; }
          sed -i -E "s|^([[:space:]]*newTag:).*|\1 \"${GITHUB_SHA}\"|" "$f"
          git diff --stat
      - name: Commit, so Argo CD deploys it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: ${GITHUB_SHA::7}" || { echo "already pinned"; exit 0; }
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
