# Jenn's shared pipeline for every app: test, then build, then deploy through git.
#
#   pull request  -> test: unit tests (if any), build the image, run it, check it answers
#   merge to main -> test again, publish ghcr.io/jennpcfo/<app>:<commit>, then pin that exact
#                    tag in deploy/kustomization.yaml. Argo CD sees the commit and deploys it.
#
# Never `latest`: what runs is always a commit you can name. The same pattern as Fortified
# Freedom's pipeline, without Kargo. Apps call this file; fix it here and every app gets the fix.
name: app
on:
  workflow_call:
    inputs:
      image:
        description: Image name without a tag, e.g. ghcr.io/jennpcfo/pourprofitcfo-site
        required: true
        type: string
      port:
        description: Port the container listens on
        type: number
        default: 8080
      health_path:
        description: Path that must answer 200 once the app is up
        type: string
        default: /healthz
      smoke_paths:
        description: Space-separated paths that must answer 200
        type: string
        default: /
      test_command:
        description: Unit tests to run first; empty means none
        type: string
        default: ""
      deploy_dir:
        description: Folder with kustomization.yaml that Argo CD deploys
        type: string
        default: deploy

# Pushes to main run one at a time per repo, in push order, test through deploy. If several
# queue up, GitHub keeps only the newest waiting run (it carries the older commits too). Pull
# requests get their own group each, so they never wait. The deploy step below also refuses to
# move the pin backwards, so even a re-run of an old run cannot deploy an older image.
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('deploy-{0}', github.repository) || format('app-{0}-{1}', github.repository, github.run_id) }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unit tests
        if: inputs.test_command != ''
        run: ${{ inputs.test_command }}
      - name: Deploy files are valid
        run: kubectl kustomize "${{ inputs.deploy_dir }}" > /dev/null
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: app:test
      - name: Run it and check it answers
        run: |
          p=${{ inputs.port }}
          docker run -d --name app --read-only --tmpfs /tmp -p $p:$p app:test
          for i in $(seq 1 30); do curl -fsS -o /dev/null "http://localhost:$p${{ inputs.health_path }}" && break; sleep 1; done
          curl -fsS -o /dev/null "http://localhost:$p${{ inputs.health_path }}" || { docker logs app; exit 1; }
          for path in ${{ inputs.smoke_paths }}; do
            curl -fsS -o /dev/null "http://localhost:$p$path" || { echo "FAILED $path"; docker logs app; exit 1; }
            echo "ok $path"
          done

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ inputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Pin the new image in the deploy files, only ever forwards
        env:
          DEPLOY_FILE: ${{ inputs.deploy_dir }}/kustomization.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            # Start from the current tip every attempt, so a push that lost a race is redone, not rebased.
            git fetch -q origin main
            git reset -q --hard origin/main
            grep -q 'newTag:' "$DEPLOY_FILE" || { echo "$DEPLOY_FILE has no newTag line"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is no longer on main"; exit 1; }
            cur=$(sed -n -E 's/^[[:space:]]*newTag:[[:space:]]*"?([^"[:space:]]*)"?.*/\1/p' "$DEPLOY_FILE" | head -n 1)
            if [ "$cur" = "$GITHUB_SHA" ]; then echo "already pinned"; exit 0; fi
            # Move only forwards: the pinned commit must be an ancestor of this one. A pin that is
            # not a commit of this repo (first deploy, placeholder) is simply replaced.
            if [[ "$cur" =~ ^[0-9a-f]{7,40}$ ]] && git cat-file -e "$cur^{commit}" 2>/dev/null \
               && ! git merge-base --is-ancestor "$cur" "$GITHUB_SHA"; then
              echo "main already pins $cur, which is newer than $GITHUB_SHA; leaving it"
              exit 0
            fi
            sed -i -E "s|^([[:space:]]*newTag:).*|\1 \"${GITHUB_SHA}\"|" "$DEPLOY_FILE"
            git diff --stat
            git commit -qam "deploy: ${GITHUB_SHA::7}"
            # Atomic: rejected if main moved since the fetch, and then the loop starts over.
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
